<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1330" viewBox="0 0 1800 1330" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .h1   { font-size: 30px; font-weight: 700; fill: #0F172A; }
      .sub  { font-size: 15px; fill: #64748B; }
      .zone { font-size: 12.5px; font-weight: 700; letter-spacing: 1.3px; }
      .ct   { font-size: 15px; font-weight: 700; fill: #0F172A; }
      .cs   { font-size: 12.5px; fill: #475569; }
      .mono { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 12px; fill: #1E293B; }
      .chipt{ font-size: 13px; font-weight: 700; fill: #0F172A; }
      .chips{ font-size: 11.5px; fill: #64748B; }
      .lbl  { font-size: 11.5px; font-weight: 600; fill: #334155; }
      .foot { font-size: 12.5px; fill: #475569; }
    </style>
  </defs>

  <rect width="1800" height="1330" fill="#FFFFFF"/>

  <!-- ── header ───────────────────────────────────────────────────────────── -->
  <text class="h1" x="60" y="52">AI Fitness Memory Agent — System Architecture</text>
  <text class="sub" x="60" y="80">Lifelong memory as the product: typed JSONB + VECTOR(512) in CockroachDB Cloud, a deterministic Memory Engine, and a model-agnostic LangGraph agent running on AWS.</text>

  <!-- ── client band ──────────────────────────────────────────────────────── -->
  <rect x="60" y="105" width="1420" height="105" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text class="zone" x="84" y="132" fill="#64748B">BROWSER · VITE + REACT SPA (SERVED BY THE SAME CONTAINER)</text>
  <g>
    <rect x="84"   y="146" width="320" height="48" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text class="chipt" x="100" y="167">Chat — /app</text>
    <text class="chips" x="100" y="185">conversation · memory receipts</text>
    <rect x="420"  y="146" width="320" height="48" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text class="chipt" x="436" y="167">Review — /app/review</text>
    <text class="chips" x="436" y="185">the memory briefing</text>
    <rect x="756"  y="146" width="320" height="48" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text class="chipt" x="772" y="167">Profile — /app/profile</text>
    <text class="chips" x="772" y="185">identity · goals · account</text>
    <rect x="1092" y="146" width="372" height="48" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text class="chipt" x="1108" y="167">Glass-box engine pane</text>
    <text class="chips" x="1108" y="185">citation → evidence rows → the SQL / K-NN that ran</text>
  </g>

  <!-- ── AWS boundary ─────────────────────────────────────────────────────── -->
  <rect x="60" y="256" width="1420" height="594" rx="18" fill="#FFFBF5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text class="zone" x="84" y="284" fill="#B45309">AWS · US-EAST-1</text>

  <!-- request / response arrows -->
  <line x1="240" y1="212" x2="240" y2="304" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <text class="lbl" x="140" y="238">HTTPS request</text>
  <line x1="292" y1="304" x2="292" y2="212" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text class="lbl" x="306" y="238">SSE + JSON</text>

  <!-- ALB -->
  <rect x="100" y="306" width="200" height="94" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
  <text class="ct" x="118" y="334">ALB (shared)</text>
  <text class="cs" x="118" y="356">managed HTTPS URL</text>
  <text class="cs" x="118" y="376">health check → /healthz</text>

  <!-- ECS task -->
  <rect x="330" y="300" width="790" height="520" rx="14" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
  <text class="zone" x="350" y="326" fill="#9A3412">AMAZON ECS EXPRESS MODE — FARGATE TASK · ONE DOCKER IMAGE</text>
  <line x1="300" y1="374" x2="348" y2="374" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <text class="lbl" x="296" y="366">:8080</text>

  <!-- FastAPI -->
  <rect x="350" y="340" width="750" height="104" rx="12" fill="#EFF6FF" stroke="#93C5FD"/>
  <text class="ct" x="368" y="366">FastAPI — api/</text>
  <text class="mono" x="368" y="388">/api/auth/*   /api/chat/stream (SSE)   /api/ingest   /api/turns   /api/traces/{id}   /api/stats</text>
  <text class="cs" x="368" y="410">session cookie auth · every query scoped by user_id (tested as a security boundary)</text>
  <text class="cs" x="368" y="430">also serves the built SPA above — one image, one origin</text>

  <!-- LangGraph agent -->
  <rect x="350" y="460" width="350" height="230" rx="12" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text class="ct" x="368" y="486">LangGraph agent — agent/</text>
  <text class="cs" x="368" y="506">the only natural-language layer</text>
  <text class="mono" x="368" y="532">history → plan → ingest →</text>
  <text class="mono" x="368" y="550">consolidate → retrieve →</text>
  <text class="mono" x="368" y="568">assemble → narrate → persist</text>
  <text class="cs" x="368" y="594">emits typed tool calls only:</text>
  <text class="mono" x="368" y="614">log_memory · analyze_series</text>
  <text class="mono" x="368" y="632">recall / aggregate / timeline / lookup</text>
  <text class="cs" x="368" y="656">never writes SQL · never feeds the</text>
  <text class="cs" x="368" y="674">glass box · narrates cited rows only</text>

  <!-- Memory Engine -->
  <rect x="750" y="460" width="350" height="230" rx="12" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text class="ct" x="768" y="486">Memory Engine — engine/</text>
  <text class="cs" x="768" y="506">deterministic core — no LLM inside</text>
  <text class="cs" x="768" y="532">ingestion + typed payload registry</text>
  <text class="cs" x="768" y="552">hybrid retrieval: SQL filters + K-NN</text>
  <text class="cs" x="768" y="572">event-driven consolidation → insights</text>
  <text class="cs" x="768" y="592">(lineage · supersede · retraction)</text>
  <text class="cs" x="768" y="612">context assembly + ranking</text>
  <text class="cs" x="768" y="632">EvidenceTrace construction</text>
  <text class="cs" x="768" y="658">invariant: no context without a trace;</text>
  <text class="cs" x="768" y="676">every claim resolves to memory ids</text>

  <line x1="702" y1="575" x2="748" y2="575" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)" marker-start="url(#arw)"/>

  <!-- model providers -->
  <rect x="350" y="706" width="750" height="96" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text class="ct" x="368" y="730">Model providers — per-role selection, config-only swap (ADR-13.2)</text>
  <rect x="368" y="742" width="356" height="48" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text class="chipt" x="382" y="763">LLM role — extract · plan · narrate</text>
  <text class="chips" x="382" y="781">Claude API (deployed) · Amazon Bedrock (supported)</text>
  <rect x="736" y="742" width="346" height="48" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text class="chipt" x="750" y="763">Embedding role — embed</text>
  <text class="chips" x="750" y="781">Amazon Bedrock · Titan Text Embeddings V2</text>

  <!-- Bedrock -->
  <rect x="1150" y="306" width="310" height="150" rx="12" fill="#FFF7ED" stroke="#FB923C"/>
  <text class="ct" x="1168" y="332">Amazon Bedrock</text>
  <text class="cs" x="1168" y="354">Titan Text Embeddings V2 — 512-dim,</text>
  <text class="cs" x="1168" y="372">normalized so L2 ≡ cosine</text>
  <text class="cs" x="1168" y="398">invoked by the ECS task role:</text>
  <text class="mono" x="1168" y="418">bedrock:InvokeModel</text>
  <text class="cs" x="1168" y="440">also the in-code default LLM provider</text>

  <!-- Secrets Manager -->
  <rect x="1150" y="472" width="310" height="96" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
  <text class="ct" x="1168" y="498">AWS Secrets Manager</text>
  <text class="mono" x="1168" y="520">DATABASE_URL · ANTHROPIC_API_KEY</text>
  <text class="cs" x="1168" y="540">resolved at task start by the execution role;</text>
  <text class="cs" x="1168" y="558">never in the image, workflow, or CI logs</text>

  <!-- CloudWatch -->
  <rect x="1150" y="584" width="310" height="76" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
  <text class="ct" x="1168" y="610">Amazon CloudWatch Logs</text>
  <text class="cs" x="1168" y="632">task logs — how the two production deploy</text>
  <text class="cs" x="1168" y="650">incidents were actually diagnosed</text>

  <!-- IAM -->
  <rect x="1150" y="676" width="310" height="110" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
  <text class="ct" x="1168" y="702">AWS IAM</text>
  <text class="cs" x="1168" y="724">task role → Bedrock invoke (no keys in env)</text>
  <text class="cs" x="1168" y="744">execution role → secrets + image pull</text>
  <text class="cs" x="1168" y="764">ci-deploy user → ECR push + ECS deploy</text>

  <!-- embeddings arrow -->
  <polyline points="1100,766 1132,766 1132,420 1146,420" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <text class="lbl" x="1122" y="600" text-anchor="middle" transform="rotate(-90 1122 600)">embeddings</text>

  <!-- Claude API (non-AWS) -->
  <rect x="1510" y="430" width="260" height="150" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text class="ct" x="1528" y="458">Anthropic Claude API</text>
  <text class="cs" x="1528" y="480">non-AWS · currently serves the</text>
  <text class="cs" x="1528" y="498">LLM role, because Bedrock grants</text>
  <text class="cs" x="1528" y="516">model access per model and this</text>
  <text class="cs" x="1528" y="534">account holds Titan but not Claude</text>
  <text class="cs" x="1528" y="558">moving back to Bedrock is one</text>
  <text class="cs" x="1528" y="576">env var — no code change</text>
  <polyline points="1120,806 1640,806 1640,584" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text class="lbl" x="1290" y="798">LLM calls (egress)</text>

  <!-- ── CockroachDB ──────────────────────────────────────────────────────── -->
  <rect x="60" y="890" width="1420" height="250" rx="18" fill="#F7F4FF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text class="zone" x="84" y="918" fill="#6D28D9">COCKROACHDB CLOUD — SYSTEM OF RECORD · TLS verify-full</text>

  <line x1="760" y1="822" x2="760" y2="928" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)" marker-start="url(#arw)"/>
  <text class="lbl" x="778" y="862">all database traffic — psycopg, one transactionally consistent store</text>
  <text class="lbl" x="778" y="880">SQL aggregation + vector K-NN + JSONB filtering in the same query path</text>

  <rect x="100" y="932" width="520" height="190" rx="12" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text class="ct" x="118" y="958">memories — typed events + derived insights (two tiers, one table)</text>
  <text class="mono" x="118" y="980">id · user_id · event_time (bi-temporal) · type · source</text>
  <text class="mono" x="118" y="998">provenance · confidence · status · superseded_by · summary</text>
  <text class="mono" x="118" y="1016">payload JSONB   ·   embedding VECTOR(512)</text>
  <rect x="118" y="1030" width="256" height="30" rx="8" fill="#EDE9FE" stroke="#C4B5FD"/>
  <text class="chipt" x="130" y="1050">VECTOR INDEX (C-SPANN)</text>
  <rect x="384" y="1030" width="218" height="30" rx="8" fill="#EDE9FE" stroke="#C4B5FD"/>
  <text class="chipt" x="396" y="1050">INVERTED INDEX payload</text>
  <rect x="118" y="1070" width="484" height="30" rx="8" fill="#EDE9FE" stroke="#C4B5FD"/>
  <text class="chipt" x="130" y="1090">INDEX (user_id, type, event_time) — timeline + aggregation scans</text>

  <rect x="650" y="932" width="390" height="90" rx="12" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text class="ct" x="668" y="958">turns · evidence_traces</text>
  <text class="cs" x="668" y="980">source of truth for what the UI renders —</text>
  <text class="cs" x="668" y="1000">one persisted, replayable EvidenceTrace per turn</text>

  <rect x="1060" y="932" width="380" height="90" rx="12" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text class="ct" x="1078" y="958">users · sessions</text>
  <text class="cs" x="1078" y="980">email + password (scrypt), opaque session</text>
  <text class="cs" x="1078" y="1000">tokens; per-user row scoping everywhere</text>

  <rect x="650" y="1032" width="390" height="90" rx="12" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text class="ct" x="668" y="1058">langgraph checkpoints</text>
  <text class="cs" x="668" y="1080">agent graph state on a custom CockroachDB</text>
  <text class="cs" x="668" y="1100">saver — the stock PostgresSaver does not work</text>

  <rect x="1060" y="1032" width="380" height="90" rx="12" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text class="ct" x="1078" y="1058">user_profile</text>
  <text class="cs" x="1078" y="1080">current-state cache: identity, goals, targets,</text>
  <text class="cs" x="1078" y="1100">rebuilt from profile_change memories</text>

  <!-- ── dev-time band ────────────────────────────────────────────────────── -->
  <rect x="60" y="1180" width="1710" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="6 4"/>
  <text class="zone" x="84" y="1206" fill="#64748B">BUILD &amp; PROVISIONING (DEV-TIME)</text>

  <rect x="84" y="1218" width="400" height="58" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text class="chipt" x="100" y="1240">GitHub Actions CI</text>
  <text class="chips" x="100" y="1260">ruff · pytest against a real CockroachDB · image build + smoke test</text>
  <line x1="492" y1="1247" x2="516" y2="1247" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="520" y="1218" width="310" height="58" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text class="chipt" x="536" y="1240">Amazon ECR</text>
  <text class="chips" x="536" y="1260">image tagged :&lt;sha&gt; for traceable rollbacks</text>
  <line x1="838" y1="1247" x2="862" y2="1247" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="866" y="1218" width="410" height="58" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text class="chipt" x="882" y="1240">amazon-ecs-deploy-express-service</text>
  <text class="chips" x="882" y="1260">every green push to main redeploys the Fargate task above</text>

  <rect x="1310" y="1218" width="440" height="58" rx="10" fill="#F7F4FF" stroke="#C4B5FD"/>
  <text class="chipt" x="1326" y="1240">ccloud CLI</text>
  <text class="chips" x="1326" y="1260">provisioned the CockroachDB Cloud cluster (2026-07-17)</text>
  <polyline points="1500,1218 1500,1148 1486,1148" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>

  <text class="foot" x="60" y="1316">CockroachDB tools: Distributed Vector Indexing (runtime) · ccloud CLI (provisioning)</text>
  <text class="foot" x="720" y="1316">AWS: Amazon Bedrock · Amazon ECS Express Mode (Fargate) · Amazon ECR · AWS Secrets Manager · Amazon CloudWatch · AWS IAM · ALB</text>
</svg>
