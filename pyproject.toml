[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-fitness-memory-agent"
# tracks the phase: 0.1 = Phase 1 deploy spine, 0.2 = Phase 2 write path,
# 0.3 = Phase 3 read path + agent + chat
version = "0.3.0"
description = "AI health companion with persistent, lifelong memory — a custom Memory Engine on CockroachDB driving a glass-box UI. CockroachDB × AWS Agentic Memory Hackathon entry."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Aditya Babanrao Jamge" }]
requires-python = ">=3.10"
# Runtime dependencies are added phase-by-phase (see docs/implementation-roadmap.md).
# Still to come: langgraph, ruptures (Phase 5 consolidation).
dependencies = [
    "psycopg[binary]>=3.2",              # Phase 1 — CockroachDB via Postgres wire protocol
    "langgraph-checkpoint-postgres>=2",  # Phase 1 — PostgresSaver canary (T2, ADR-13.8)
    "langgraph>=1.2",                    # Phase 3 — the agent graph (M5 spine)
    "fastapi>=0.115",                    # Phase 1 — deploy-early hello app (T10, ADR-11)
    "uvicorn[standard]>=0.30",           # Phase 1 — ASGI server for the single container
    "pydantic>=2",                       # Phase 2 — payload type registry (T3, ADR-13.6)
    "boto3>=1.34",                       # Phase 2 — Bedrock extraction + Titan V2 embeddings
    "tzdata>=2024.1",                    # Phase 3 — IANA db for tz slot validation (zoneinfo
                                         # has no system db on Windows / slim images)
    "python-multipart>=0.0.9",           # Phase 5 (M7) — required by FastAPI/Starlette for the
                                         # photo-upload endpoint's multipart/form-data parsing
    "pillow>=10.0",                      # Phase 5 (M7) — verify an upload actually decodes as
                                         # an image before it is trusted, and strip EXIF before
                                         # it reaches the vision model
    # The Claude API provider adapter (agent/providers/claude_api.py). Production, not just
    # dev: ADR-13.2 (amended 2026-08-02) made LLM_PROVIDER=claude_api a first-class production
    # configuration, and the deploy workflow (ci.yml) sets exactly that — so the deployed image
    # needs this SDK even though EMBEDDING_PROVIDER stays on bedrock.
    "anthropic>=0.69",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",         # Phase 2 — FastAPI TestClient (auth + scoping tests)
    # Lets engine/config.py read a local .env (see .env.example). Dev-only on purpose: the
    # deployed image has no .env and reads real environment variables from the task definition.
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
# Monorepo top-level packages (see README.md → Repository structure).
packages = ["engine", "agent", "api", "cli", "evals"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "agent/tests", "api/tests", "cli/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `param: T = Depends(...)` is the framework's required idiom, not a mutable
# default-arg bug — B008 is a false positive here.
"api/routers/*" = ["B008"]
