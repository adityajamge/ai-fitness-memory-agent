# CI (T10, ADR-13.8): lint + pytest against a REAL single-node CockroachDB —
# the day-one canaries (vector index, checkpointer) run here on every push and
# fail hard if the DB is missing (CI env var → REQUIRE_DB semantics in the tests).
# The Docker image is built and smoke-tested on every push so the deploy artifact
# can never rot. The deploy job pushes to ECR and deploys the :sha tag to
# Amazon ECS Express Mode (ADR-13.3 as amended 2026-07-19; see docs/deploy.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CRDB_VERSION: v26.2.4 # matches the version the canaries were verified against

jobs:
  # Frontend gate. Runs in parallel with the backend job and needs no database, so a type or
  # contract error in web/ fails in ~40s instead of behind a five-minute pytest run.
  web:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24" # react-router@8 requires >=22.22.0; matches the Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    name: Lint + tests (real CockroachDB) + image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Service containers can't override the image command, and CockroachDB
      # needs `start-single-node --insecure` — so plain docker run instead.
      - name: Start single-node CockroachDB
        run: |
          docker run -d --name crdb \
            -p 26257:26257 -p 8081:8080 \
            cockroachdb/cockroach:${CRDB_VERSION} start-single-node --insecure
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:8081/health?ready=1" && break
            [ "$i" = 30 ] && { echo "CockroachDB never became ready"; docker logs crdb; exit 1; }
            sleep 1
          done

      - name: Install
        run: pip install -e . --group dev

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests incl. canaries (fail hard without DB — CI is set)
        env:
          DATABASE_URL: postgresql://root@localhost:26257/defaultdb?sslmode=disable
        run: pytest -v

      - name: Build app image
        run: docker build -t ai-fitness-memory-agent:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --name app -p 8080:8080 ai-fitness-memory-agent:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz && break
            [ "$i" = 20 ] && { echo "app never became healthy"; docker logs app; exit 1; }
            sleep 1
          done
          # The SPA is served from this same container (ADR-13.3): "/" must return the built
          # shell, not the placeholder, or stage 1 silently produced nothing.
          curl -fsS http://localhost:8080/ | grep -i "Memory Agent"
          curl -fsS http://localhost:8080/ | grep -q '<script type="module"' \
            || { echo "'/' did not serve the built SPA shell"; docker logs app; exit 1; }
          # A deep link must reach the shell so client-side routing survives a refresh...
          curl -fsS http://localhost:8080/app | grep -q '<div id="root">' \
            || { echo "SPA fallback did not answer a deep link"; exit 1; }
          # ...but the fallback must never shadow the API.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/nope)" = "404" ] \
            || { echo "SPA fallback swallowed an unknown /api path"; exit 1; }

  deploy:
    name: Push to ECR + deploy to ECS Express Mode
    needs: [test, web]
    # Gated on a repo variable so CI is green before the one-time AWS setup
    # (docs/deploy.md) is done. Flip AWS_DEPLOY_ENABLED to 'true' to activate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (:sha = the deployed, rollback-able artifact)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/ai-fitness-memory-agent
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

      # Fail before touching the service rather than deploying a half-configured one.
      # Every value below is required for the write path; a missing one used to
      # surface as a green /healthz with every /api/* route broken (docs/deploy.md).
      - name: Verify deploy configuration is complete
        env:
          ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
          ECS_INFRASTRUCTURE_ROLE_ARN: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
          ECS_TASK_ROLE_ARN: ${{ vars.ECS_TASK_ROLE_ARN }}
          DATABASE_URL_SECRET_ARN: ${{ vars.DATABASE_URL_SECRET_ARN }}
          ANTHROPIC_API_KEY_SECRET_ARN: ${{ vars.ANTHROPIC_API_KEY_SECRET_ARN }}
        run: |
          missing=""
          for v in ECS_EXECUTION_ROLE_ARN ECS_INFRASTRUCTURE_ROLE_ARN ECS_TASK_ROLE_ARN \
                   DATABASE_URL_SECRET_ARN ANTHROPIC_API_KEY_SECRET_ARN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required repo variables:$missing"
            echo "::error::See docs/deploy.md -> Runtime configuration (declarative)."
            exit 1
          fi

      # RUNTIME CONFIGURATION LIVES HERE, IN VERSION CONTROL — not in the console.
      #
      # The action rebuilds the whole service config from these inputs on every run:
      # it calls DescribeServices only to decide create-vs-update and to read tags,
      # then sends UpdateExpressGatewayService with a freshly built primaryContainer
      # (index.js:341-352, 496-517). Nothing configured by hand is read back, so any
      # input omitted here is an input the deploy does not carry forward. That is why
      # task-role-arn and health-check-path are passed explicitly too — they are the
      # same risk class as the environment, and losing them breaks Bedrock access and
      # the ALB health check respectively.
      - name: Deploy to ECS Express Mode
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ai-fitness-memory-agent
          image: ${{ steps.ecr.outputs.registry }}/ai-fitness-memory-agent:${{ github.sha }}
          execution-role-arn: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
          # Grants the *container* bedrock:InvokeModel (embeddings). Distinct from the
          # execution role, which only pulls the image and reads the secrets below.
          task-role-arn: ${{ vars.ECS_TASK_ROLE_ARN }}
          container-port: "8080"
          health-check-path: /healthz
          cpu: "256"
          memory: "512"
          # Non-sensitive runtime settings. Mixed-provider deployment (ADR-13.2 as
          # amended 2026-08-02): Claude API for the LLM roles, Bedrock for embeddings.
          # EMBED_DIMS is deliberately NOT set — engine/config.py already defaults to
          # 512 and a second source of truth could drift from VECTOR(512) in schema.sql.
          environment-variables: |
            [
              {"name": "AWS_REGION",          "value": "${{ vars.AWS_REGION || 'us-east-1' }}"},
              {"name": "LLM_PROVIDER",        "value": "claude_api"},
              {"name": "EMBEDDING_PROVIDER",  "value": "bedrock"},
              {"name": "CLAUDE_API_MODEL_ID", "value": "claude-haiku-4-5-20251001"},
              {"name": "CLAUDE_API_EFFORT",   "value": "low"},
              {"name": "DEFAULT_TZ",          "value": "Asia/Kolkata"}
            ]
          # Injected by ECS from Secrets Manager at task start, so the values never
          # appear in the task definition, the workflow, or CI logs. The execution
          # role needs secretsmanager:GetSecretValue on both ARNs.
          secrets: |
            [
              {"name": "DATABASE_URL",      "valueFrom": "${{ vars.DATABASE_URL_SECRET_ARN }}"},
              {"name": "ANTHROPIC_API_KEY", "valueFrom": "${{ vars.ANTHROPIC_API_KEY_SECRET_ARN }}"}
            ]

      - name: Service URL
        run: echo "Deployed to ${{ steps.deploy.outputs.endpoint }}"
