<!-- The brand mark (DESIGN.md §2): a filled square holding a hairline inset square.
     A data cell containing a data cell — two-tier memory, rendered as a glyph.
     Signal on background, no gradient, 1px corners. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="2" fill="#0B0D10" />
  <rect x="6" y="6" width="20" height="20" rx="1" fill="#FFB224" />
  <rect
    x="12.5"
    y="12.5"
    width="7"
    height="7"
    rx="0.5"
    fill="none"
    stroke="#0B0D10"
    stroke-width="1.5"
  />
</svg>
